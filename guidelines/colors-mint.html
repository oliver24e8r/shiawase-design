<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 26px;font-family:var(--font-body);color:var(--fg-1);background:var(--surface-page)}.lbl{font:500 10px var(--font-latin);letter-spacing:.14em;color:var(--fg-3)}.sw{display:flex;flex-direction:column;gap:6;min-width:0}.chip{height:62px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(31,79,85,.06)}.row{display:grid;gap:12px}</style></head><body><div class="row" style="grid-template-columns:repeat(6,minmax(0,1fr))"><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--mint-50)"></div><div style="font-size:11px;font-weight:500">Mint 50</div><div class="lbl">--mint-50 · #EEF8F5</div></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--mint-100)"></div><div style="font-size:11px;font-weight:500">Mint 100</div><div class="lbl">--mint-100 · #DDF1EC</div></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--mint-200)"></div><div style="font-size:11px;font-weight:500">Mint 200</div><div class="lbl">--mint-200 · #C3E6DF</div></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--mint-300)"></div><div style="font-size:11px;font-weight:500">Mint 300 · hero</div><div class="lbl">--mint-300 · #A8D9CF</div></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--mint-500)"></div><div style="font-size:11px;font-weight:500">Mint 500</div><div class="lbl">--mint-500 · #6FB5A8</div></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--teal-800)"></div><div style="font-size:11px;font-weight:500">Teal 800 · ink</div><div class="lbl">--teal-800 · #1F4F55</div></div></div></body></html>
