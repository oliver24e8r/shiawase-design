<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 26px;font-family:var(--font-body);color:var(--fg-1);background:var(--surface-page)}.lbl{font:500 10px var(--font-latin);letter-spacing:.14em;color:var(--fg-3)}.sw{display:flex;flex-direction:column;gap:6;min-width:0}.chip{height:62px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(31,79,85,.06)}.row{display:grid;gap:12px}</style></head><body><div class="row" style="grid-template-columns:repeat(6,minmax(0,1fr))"><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--cream-0)"></div><div style="font-size:11px;font-weight:500">White · card</div><div class="lbl">--cream-0 · #FFFFFF</div></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--cream-50)"></div><div style="font-size:11px;font-weight:500">Cream · page</div><div class="lbl">--cream-50 · #FCF8F6</div></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--grid-line)"></div><div style="font-size:11px;font-weight:500">Grid line</div><div class="lbl">--grid-line · #F0E4E0</div></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--lilac-50)"></div><div style="font-size:11px;font-weight:500">Lilac · band</div><div class="lbl">--lilac-50 · #F6F3FA</div></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--line-200)"></div><div style="font-size:11px;font-weight:500">Hairline</div><div class="lbl">--line-200 · #E9DFDB</div></div><div class="sw" style="display:flex;flex-direction:column;gap:6px"><div class="chip" style="background:var(--ink-500)"></div><div style="font-size:11px;font-weight:500">Ink 500 · body</div><div class="lbl">--ink-500 · #5E7275</div></div></div></body></html>
