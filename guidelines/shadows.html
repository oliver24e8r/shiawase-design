<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 26px;font-family:var(--font-body);color:var(--fg-1);background:var(--surface-page)}.lbl{font:500 10px var(--font-latin);letter-spacing:.14em;color:var(--fg-3)}.sw{display:flex;flex-direction:column;gap:6;min-width:0}.chip{height:62px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(31,79,85,.06)}.row{display:grid;gap:12px}</style></head><body><div style="display:flex;gap:28px;align-items:center;height:104px"><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div style="width:130px;height:62px;background:#fff;border-radius:14px;box-shadow:var(--shadow-soft)"></div><div class="lbl">--shadow-soft</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div style="width:130px;height:62px;background:#fff;border-radius:14px;box-shadow:var(--shadow-card)"></div><div class="lbl">--shadow-card</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div style="width:130px;height:62px;background:#fff;border-radius:14px;box-shadow:var(--shadow-frame)"></div><div class="lbl">--shadow-frame</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div style="padding:12px 24px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;box-shadow:var(--shadow-cta)">CTA</div><div class="lbl">--shadow-cta</div></div></div></body></html>
