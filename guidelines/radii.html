<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 26px;font-family:var(--font-body);color:var(--fg-1);background:var(--surface-page)}.lbl{font:500 10px var(--font-latin);letter-spacing:.14em;color:var(--fg-3)}.sw{display:flex;flex-direction:column;gap:6;min-width:0}.chip{height:62px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(31,79,85,.06)}.row{display:grid;gap:12px}</style></head><body><div style="display:flex;gap:22px;align-items:center;height:96px"><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:80px;height:56px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-card)"></div><div class="lbl">--radius-sm</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:80px;height:56px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-card)"></div><div class="lbl">--radius-md</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:80px;height:56px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card)"></div><div class="lbl">--radius-lg</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:80px;height:56px;background:#fff;border-radius:var(--radius-xl);box-shadow:var(--shadow-card)"></div><div class="lbl">--radius-xl</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:120px;height:56px;background:#fff;border-radius:var(--radius-pill);box-shadow:var(--shadow-card)"></div><div class="lbl">--radius-pill</div></div></div></body></html>
