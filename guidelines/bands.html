<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px 26px;font-family:var(--font-body);color:var(--fg-1);background:var(--surface-page)}.lbl{font:500 10px var(--font-latin);letter-spacing:.14em;color:var(--fg-3)}.sw{display:flex;flex-direction:column;gap:6;min-width:0}.chip{height:62px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(31,79,85,.06)}.row{display:grid;gap:12px}</style></head><body><div class="shiawase-grid-bg" style="padding:14px;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:14px"><div style="height:96px;border-radius:28px;background:linear-gradient(180deg,var(--lilac-100),var(--lilac-50))"></div><div style="height:96px;border-radius:28px;background:linear-gradient(180deg,var(--peach-100),var(--peach-50))"></div></div></body></html>
